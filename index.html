<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoS</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script src="./js/productos.js"></script>
    <script src="./js/function.js"></script>
    <script src="./js/botones.js"></script>
</head>

<body>
    <!-- Imagen en la esquina superior izquierda -->
    <img src="./img/OXXO-Logo.png" class="logo">

    <!-- Imagen en la esquina superior derecha -->
    <img src="./img/cinepolis-logo.png" class="logoR">


    <!-- Titulo principal -->
    <div class="contenido">
        <div>
            <h1 class="titulo">
                SonoTech
            </h1>
            <h2 class="subtitulo">
                ¡No es bueno pero es barato!
            </h2>
        </div>
    </div>

    <!-- Área principal donde se muestran los productos -->
    <div class="contenedor">
        <table id="tableId">

            <tr>
                <th class="tituloCantidad">
                    Cantidad
                </th>
                <th>
                    Producto
                </th>
                <th>
                    Precio
                </th>
                <th>
                    Total
                </th>
            </tr>

            <tbody id="carrito"></tbody>

        </table>
    </div>

    <!-- Único INPUT de todo el sistema -->
    <input type="text" id="codigoProducto" class="cProd" value="" onkeydown="buscarProducto(event)" autofocus>



    <!-- Botones -->
    <div class="btn">

        <input type="button" id="btn1" class="boton">
        <input type="button" id="btn2" class="boton">
        <input type="button" id="btn3" class="boton">
        <input type="button" id="btn4" class="boton">
        <input type="button" id="btn5" class="boton">

        <div class="total">

            <h1 id="total">
                $0.00
            </h1>

        </div>

        <h4>Cambio</h4>
        <h4 id="mostrarCambio">
            $0.00
        </h4>



    </div>

<div id="modalProductos" class="modal">

    <div class="modal-contenido">

        <span id="cerrar">&times;</span>

        <h2>Selecciona una papita</h2>

        <div class="opcionesPapitas">

            <div class="opcionPapita">
                <img src="./img/adobada.png" class="papita" data-nombre="Sabritas" data-precio="18">
                <h3>$18</h3>
            </div>

            <div class="opcionPapita">
                <img src="./img/peanuts.png" class="papita" data-nombre="Doritos" data-precio="20">
                <h3>$20</h3>
            </div>

            <div class="opcionPapita">
                <img src="./img/churrumais.png" class="papita" data-nombre="Ruffles" data-precio="22">
                <h3>$22</h3>
            </div>

        </div>

    </div>

</div>

    <div id="modalCafe" class="modal">

        <div class="modal-contenido">

            <span id="cerrarBtn2">&times;</span>


            <h2>Selecciona una tamaño</h2>

            <div class="opcionesCafe">
                <img src="./img/cafe.png" class="tamanoCafe cafeChico" data-nombre="Café Chico" data-precio="34">
                <h3>$34.00</h3>
                <img src="./img/cafe.png" class="tamanoCafe cafeMediano" data-nombre="Café Mediano" data-precio="54">
                <h3>$54.00</h3>
                <img src="./img/cafe.png" class="tamanoCafe cafeGrande" data-nombre="Café Grande" data-precio="64">
                <h3>$64.00</h3>
            </div>

        </div>

</body>

</html>
